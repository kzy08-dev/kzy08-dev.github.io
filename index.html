<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feral Gremlin - Calendar</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" type="image/x-icon" href="assets/icons/favicon.ico">
</head>
<body>

    <!-- Sidebar Injected Here -->
    <div id="sidebar-container"></div>
    
    <main class="main-content">
        <!-- Header Injected Here -->
        <div id="header-container"></div>

        <!-- Calendar Page -->
        <section class="calendar-page">
            <div class="calendar-layout">
                <!-- Calendar -->
                <div class="calendar-container">
                    <div class="calendar-header">
                        <button id="prevMonth" class="month-btn">◀</button>
                        <h2 id="monthYear"></h2>
                        <button id="nextMonth" class="month-btn">▶</button>
                    </div>

                    <div class="weekday-row">
                        <div>Sun</div>
                        <div>Mon</div>
                        <div>Tue</div>
                        <div>Wed</div>
                        <div>Thu</div>
                        <div>Fri</div>
                        <div>Sat</div>
                    </div>
                    <div id="calendarGrid" class="calendar-grid"></div>
                </div>

                <!-- Right Side Panel -->
                <div class="calendar-side-panel">
                    <div class="stat-card">
                        <h3>My Balance</h3>
                        <div id="balanceDisplay" class="stat-value"><img src="assets/images/gremlin_coin.png" class="coin-icon" alt="coin"> 0</div>
                    </div>
                    
                    <div class="stat-card">
                        <h3>Pet Happiness</h3>
                        <div class="emotion-container" style="width: 100%;">
                            <div class="emotion-meter">
                                <div id="emotionFill"></div>
                            </div>
                        </div>
                    </div>

                    <a href="task-inputter.html" class="edit-schedule-btn">
                        Edit Schedule
                    </a>
                    <!-- Button to block off time (recurring events) + button for notetaking -->
                    <button id="blockTime" class="edit-schedule-btn"> Mark Time Unavailable </button>
                    <button id="notetaking" class="edit-schedule-btn"> Notes </button>
                </div>
            </div>
        </section>
    </main>

    <!-- Reward Toast -->
    <div id="rewardToast" class="reward-toast"></div>

    <!-- Day Schedule Modal -->
    <div id="scheduleModal" class="modal hidden">
        <div class="modal-content">
            <h2 id="selectedDateHeading"></h2>

            <div class="schedule-table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>Time</th>
                            <th>Tasks</th>
                        </tr>
                    </thead>
                    <tbody id="scheduleBody"></tbody>
                </table>
            </div>

            <button id="closeModal" class="close-btn">Close To-Do List</button>
        </div>
    </div>

    <div class="modalSchedule-backdrop">
      <div class="modalSchedule-content">
        <h2>Set Unavailability</h2>
        
        <form id="unavailabilitySchedule-Form" onsubmit="event.preventDefault();">
          <!-- Step 1: Selection Type -->
          <div class="formSchedule-group">
            <label class="sectionSchedule-label">Select Unavailability Type</label>
            <div class="radioSchedule-group">
              <label class="radioSchedule-label">
                <input type="radio" name="unavailabilitySchedule-Type" value="specific" checked>
                <span>Specific Date</span>
              </label>
              <label class="radioSchedule-label">
                <input type="radio" name="unavailabilitySchedule-Type" value="recurring">
                <span>Recurring Habit</span>
              </label>
            </div>
          </div>
    
          <!-- Step 2A: Specific Date Fields -->
          <div id="specificDateSchedule-Section" class="conditionalSchedule-section">
            <div class="formSchedule-group">
              <label for="specificDateSchedule-Input">Date</label>
              <input type="date" id="specificDateSchedule-Input" class="modalTaskSchedule-Input">
            </div>
          </div>
    
          <!-- Step 2B: Recurring Habit Fields -->
          <div id="recurringSchedule-Section" class="conditionalSchedule-section" style="display: none;">
            <div class="formSchedule-group">
              <label for="frequencySchedule-Select">Frequency</label>
              <select id="frequencySchedule-Select" class="modalTaskSchedule-Input">
                <option value="weekly">Weekly</option>
                <option value="bi-weekly">Bi-weekly</option>
                <option value="tri-weekly">Tri-weekly</option>
              </select>
            </div>
            
            <div class="formSchedule-group">
              <label class="sectionSchedule-label">Repeat Days</label>
              <div class="weekdaySchedule-picker">
                <label class="daySchedule-btn"><input type="checkbox" value="M"><span>M</span></label>
                <label class="daySchedule-btn"><input type="checkbox" value="T"><span>T</span></label>
                <label class="daySchedule-btn"><input type="checkbox" value="W"><span>W</span></label>
                <label class="daySchedule-btn"><input type="checkbox" value="TH"><span>Th</span></label>
                <label class="daySchedule-btn"><input type="checkbox" value="F"><span>F</span></label>
                <label class="daySchedule-btn"><input type="checkbox" value="SA"><span>Sa</span></label>
                <label class="daySchedule-btn"><input type="checkbox" value="SU"><span>Su</span></label>
              </div>
            </div>
          </div>
    
          <!-- Step 3: Shared Time Period Fields -->
          <div class="timeRangeSchedule-grid">
            <div class="formSchedule-group">
              <label for="startTimeSchedule-Input">Start Time</label>
              <input type="time" id="startTimeSchedule-Input" class="modalTaskSchedule-Input">
            </div>
            <div class="formSchedule-group">
              <label for="endTimeSchedule-Input">End Time</label>
              <input type="time" id="endTimeSchedule-Input" class="modalTaskSchedule-Input">
            </div>
          </div>
    
          <!-- Step 4: Finish Button -->
          <button type="submit" class="btnSchedule-finish">Finish</button>
          <button type="button" class="btnSchedule-cancel">Cancel</button>
        </form>
      </div>
    </div>

    <!-- Notes Modal -->
    <div class="modalNotes-overlay">
      <div class="modalNotes-container">
        <div class="modalNotes-header">
          <h2>Notes About Tasks</h2>
        </div>
        
        <div class="modalNotes-body">
          <textarea 
            class="modalNotes-input" 
            placeholder="Type your task notes here..."
            spellcheck="false"
          ></textarea>
        </div>
        
        <div class="modalNotes-footer">
          <button class="modalNotes-btn modalNotes-cancel">Cancel</button>
          <button class="modalNotes-btn modalNotes-finish">Finish</button>
        </div>
      </div>
    </div>
    <!-- Task Deletion Prompt Modal -->
    <div id="deletePromptModal" class="modalNotes-overlay">
      <div class="modalNotes-container" style="max-width: 400px; text-align: center;">
        <div class="modalNotes-header">
          <h2 id="deletePromptTitle">Delete Task?</h2>
        </div>
        <div class="modalNotes-body">
          <p id="deletePromptMessage" style="color: var(--text-dim); margin-bottom: 20px;">Are you sure you want to delete this task?</p>
          <div id="deleteRecurringOptions" style="display: none; flex-direction: column; gap: 10px;">
            <button id="deleteBtnAll" class="modalNotes-btn" style="border-color: var(--accent-pink); color: var(--accent-pink);">Delete ALL recurring tasks</button>
            <button id="deleteBtnOne" class="modalNotes-btn">Only this one</button>
          </div>
          <div id="deleteSingleOption" style="display: none; justify-content: center;">
            <button id="deleteBtnSingle" class="modalNotes-btn" style="border-color: var(--accent-pink); color: var(--accent-pink);">Delete Task</button>
          </div>
        </div>
        <div class="modalNotes-footer" style="justify-content: center;">
          <button id="deleteBtnCancel" class="modalNotes-btn modalNotes-cancel">Cancel</button>
        </div>
      </div>
    </div>

    <!-- Firebase SDK & Helper -->
    <script type="module" src="js/firebase-db.js"></script>
    <script src="js/main.js"></script>
    <script src="js/calendar.js"></script>
    <script src="js/blocked-time.js"></script>
</body>
</html>
