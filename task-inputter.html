<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feral Gremlin - Task Inputter</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" type="image/x-icon" href="assets/icons/favicon.ico">
</head>
<body>
    <!-- Sidebar Injected Here -->
    <div id="sidebar-container"></div>
    
    <main class="main-content">
        <!-- Header Injected Here -->
        <div id="header-container"></div>
        
        <section class="task-page">
            <div class="task-controls" style="justify-content: flex-start; gap: 20px;">
                <div class="date-section">
                    <label for="taskDate">Select Calendar Date</label>
                    <input type="date" id="taskDate">
                </div>

                <button id="openTaskModal" class="add-task-btn">Add Task</button>
                <button id="blockTime" class="add-task-btn" style="background: #ff416c; border-color: #ff416c; box-shadow: 0 0 15px rgba(255, 65, 108, 0.4);">Mark Time Unavailable</button>
            </div>

            <div class="priority-layout">
                <div class="priority-box" data-priority="high">
                    <h2>High Priority</h2>
                    <div id="highTasks" class="task-dropzone"></div>
                </div>

                <div class="priority-box" data-priority="medium">
                    <h2>Medium Priority</h2>
                    <div id="mediumTasks" class="task-dropzone"></div>
                </div>

                <div class="priority-box" data-priority="low">
                    <h2>Low Priority</h2>
                    <div id="lowTasks" class="task-dropzone"></div>
                </div>
            </div>

            <div class="generate-container">
                <button class="generate-btn" id="generateSchedule">Generate Schedule</button>
            </div>
        </section>
    </main>

    <!-- TASK MODAL -->
    <div id="taskModal" class="modal hidden">
        <div class="modal-content">
            <h2>Add New Task</h2>
    
            <div class="modal-body">
                <label for="taskName">Task Name</label>
                <input type="text" id="taskName" placeholder="e.g. Wash the dishes" maxlength="100" class="modalTask-Input">
              
                <label for="taskDuration">Duration (Minutes)</label>
                <input type="number" id="taskDuration" placeholder="30" min="5" step="5" class="modalTask-Input">
    
                <label for="taskStartTime">Optional Start Time (Restricts Scheduling)</label>
                <input type="time" id="taskStartTime" class="modalTask-Input">
    
                <div class="music-choice">
                    <h3>Ambient Soundtrack</h3>
                    <label><input type="radio" name="music" value="default" checked> Default Focus Track</label>
                    <label><input type="radio" name="music" value="playlist"> Use My Playlist</label>
                </div>
    
                <div class="music-choice" style="margin-top: 15px;">
                    <h3>Recurrence</h3>
                    <label><input type="radio" name="recurrence" value="none" checked> One-time</label>
                    <label><input type="radio" name="recurrence" value="daily"> Daily</label>
                    <label><input type="radio" name="recurrence" value="weekly"> Weekly</label>
                    <label><input type="radio" name="recurrence" value="monthly"> Monthly</label>
                    <label><input type="radio" name="recurrence" value="quarterly"> Quarterly</label>
                </div>
            </div>
            <div class="modal-buttons">
                <button id="finishTask" class="add-task-btn">Add Task</button>
                <button id="cancelTask" class="close-btn">Cancel</button>
            </div>
        </div>
    </div>

    <!-- Unavailability Modal -->
    <div class="modalSchedule-backdrop">
      <div class="modalSchedule-content">
        <h2>Set Unavailability</h2>
        
        <form id="unavailabilitySchedule-Form" onsubmit="event.preventDefault();">
          <div class="formSchedule-group">
            <label class="sectionSchedule-label">Select Unavailability Type</label>
            <div class="radioSchedule-group">
              <label class="radioSchedule-label">
                <input type="radio" name="unavailabilitySchedule-Type" value="specific" checked>
                <span>Specific Date</span>
              </label>
              <label class="radioSchedule-label">
                <input type="radio" name="unavailabilitySchedule-Type" value="recurring">
                <span>Recurring Habit</span>
              </label>
            </div>
          </div>
    
          <div id="specificDateSchedule-Section" class="conditionalSchedule-section">
            <div class="formSchedule-group">
              <label for="specificDateSchedule-Input">Date</label>
              <input type="date" id="specificDateSchedule-Input" class="modalTaskSchedule-Input">
            </div>
          </div>
    
          <div id="recurringSchedule-Section" class="conditionalSchedule-section" style="display: none;">
            <div class="formSchedule-group">
              <label for="frequencySchedule-Select">Frequency</label>
              <select id="frequencySchedule-Select" class="modalTaskSchedule-Input">
                <option value="weekly">Weekly</option>
                <option value="bi-weekly">Bi-weekly</option>
                <option value="tri-weekly">Tri-weekly</option>
              </select>
            </div>
            
            <div class="formSchedule-group">
              <label class="sectionSchedule-label">Repeat Days</label>
              <div class="weekdaySchedule-picker">
                <label class="daySchedule-btn"><input type="checkbox" value="M"><span>M</span></label>
                <label class="daySchedule-btn"><input type="checkbox" value="T"><span>T</span></label>
                <label class="daySchedule-btn"><input type="checkbox" value="W"><span>W</span></label>
                <label class="daySchedule-btn"><input type="checkbox" value="TH"><span>Th</span></label>
                <label class="daySchedule-btn"><input type="checkbox" value="F"><span>F</span></label>
                <label class="daySchedule-btn"><input type="checkbox" value="SA"><span>Sa</span></label>
                <label class="daySchedule-btn"><input type="checkbox" value="SU"><span>Su</span></label>
              </div>
            </div>
          </div>
    
          <div class="timeRangeSchedule-grid">
            <div class="formSchedule-group">
              <label for="startTimeSchedule-Input">Start Time</label>
              <input type="time" id="startTimeSchedule-Input" class="modalTaskSchedule-Input">
            </div>
            <div class="formSchedule-group">
              <label for="endTimeSchedule-Input">End Time</label>
              <input type="time" id="endTimeSchedule-Input" class="modalTaskSchedule-Input">
            </div>
          </div>
    
          <button type="submit" class="btnSchedule-finish">Finish</button>
          <button type="button" class="btnSchedule-cancel">Cancel</button>
        </form>
      </div>
    </div>

    <!-- Firebase SDK & Helper -->
    <script type="module" src="js/firebase-db.js"></script>
    <script src="js/main.js"></script>
    <script src="js/task-inputter.js"></script>
    <script src="js/blocked-time.js"></script>
</body>
</html>
